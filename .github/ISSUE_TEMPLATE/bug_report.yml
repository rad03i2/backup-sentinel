name: Bug report
description: Report a reproducible Backup Sentinel problem without exposing private backup data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please sanitize file paths, manifests, and logs before posting them publicly.

  - type: input
    id: version
    attributes:
      label: Backup Sentinel version or commit
      placeholder: "1.0.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
      placeholder: "Windows 11, Python 3.12"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command or API call
      description: Use sanitized paths and sample names.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mention hidden files, symlinks, existing restore targets, or filesystem behavior if relevant.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private documents, real backup contents, and sensitive paths from this report.
          required: true

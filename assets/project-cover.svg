<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Backup Sentinel project identity cover</title>
  <desc id="desc">Dark infrastructure themed cover showing guarded snapshot layers, verification signals, and the Backup Sentinel name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08100D"/>
      <stop offset="0.58" stop-color="#0C1713"/>
      <stop offset="1" stop-color="#11271F"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59E39A"/>
      <stop offset="1" stop-color="#1FA96B"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#233B32" stroke-width="1" opacity=".38"/>
    </pattern>
  </defs>

  <rect width="1600" height="720" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="720" rx="34" fill="url(#grid)" opacity=".42"/>
  <circle cx="1265" cy="225" r="220" fill="#1E8F60" opacity=".11" filter="url(#soft)"/>
  <circle cx="1390" cy="540" r="170" fill="#F4B740" opacity=".07" filter="url(#soft)"/>

  <g transform="translate(1080 118)">
    <path d="M190 18 344 72v128c0 135-72 234-154 282C108 434 36 335 36 200V72Z" fill="#0D1D17" stroke="url(#shield)" stroke-width="8"/>
    <path d="M102 176c0-18 15-33 33-33h110c18 0 33 15 33 33v22H102Z" fill="#173D2F" stroke="#59E39A" stroke-width="4"/>
    <rect x="87" y="198" width="206" height="74" rx="18" fill="#10271F" stroke="#2DBF7C" stroke-width="4"/>
    <rect x="72" y="276" width="236" height="74" rx="18" fill="#0F211B" stroke="#249A66" stroke-width="4"/>
    <circle cx="116" cy="235" r="8" fill="#59E39A"/>
    <circle cx="116" cy="313" r="8" fill="#F4B740"/>
    <path d="m166 300 20 20 42-48" fill="none" stroke="#59E39A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M142 235h104M142 313h36" stroke="#A9BDB4" stroke-width="8" stroke-linecap="round" opacity=".78"/>
    <path d="M190 88v42" stroke="#F4B740" stroke-width="6" stroke-linecap="round"/>
    <circle cx="190" cy="69" r="10" fill="#F4B740"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="118" y="156" fill="#59E39A" font-size="25" font-weight="700" letter-spacing="5">VERIFIED LOCAL BACKUPS</text>
    <text x="112" y="274" fill="#F4F7F5" font-size="84" font-weight="800" letter-spacing="-2">Backup Sentinel</text>
    <text x="118" y="336" fill="#A9BDB4" font-size="31" font-weight="500">Versioned snapshots. SHA-256 verification. Guarded restore.</text>

    <g transform="translate(118 410)">
      <rect width="240" height="56" rx="28" fill="#10291F" stroke="#2DBF7C" stroke-width="2"/>
      <circle cx="31" cy="28" r="9" fill="#59E39A"/>
      <text x="54" y="36" fill="#DCE8E2" font-size="21" font-weight="650">LOCAL-FIRST</text>

      <rect x="258" width="248" height="56" rx="28" fill="#1C211A" stroke="#8A6A24" stroke-width="2"/>
      <circle cx="289" cy="28" r="9" fill="#F4B740"/>
      <text x="313" y="36" fill="#E6DDC9" font-size="21" font-weight="650">SAFE DEFAULTS</text>
    </g>

    <path d="M118 526H708" stroke="#2D463C" stroke-width="2"/>
    <text x="118" y="580" fill="#DDE6E2" font-size="24" font-weight="650">A Radwan Abd alhady Project</text>
    <text x="118" y="624" fill="#8EA49A" font-size="24">رضوان عبدالهادي</text>
    <text x="118" y="660" fill="#60776D" font-size="18">Integrity before restore • Predictable by design</text>
  </g>
</svg>